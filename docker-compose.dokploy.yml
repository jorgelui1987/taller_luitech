# ⚠️⚠️⚠️ IMPORTANTE ⚠️⚠️⚠️
# Este archivo es la configuracion CORRECTA para Dokploy
#
# Usa este archivo en Dokploy → pestaña "docker-compose" en vez del docker-compose.yml local
#
# Cambios criticos vs docker-compose.yml:
# 1. storage se monta en un NAMED VOLUME persistente (no se borra en deploys)
# 2. La base de datos es EXTERNA (PostgreSQL administrado de Dokploy)
#    — NO uses el MySQL del stack, porque se destruye en cada deploy
# 3. Todas las variables de entorno se configuran en Dokploy, NO en este archivo

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ── Caché de build ──
      # Docker ya invalida las capas COPY cuando el código cambia (checksum),
      # así que NO necesitas cambiar BUILD_ID a mano en cada deploy.
      # BUILD_ID es solo una etiqueta informativa (ver /BUILD_ID.txt).
      # Si Dokploy llega a reutilizar imagen vieja, activa en Dokploy:
      # Auto Deploy (push a main) + "Force Rebuild" / "Rebuild" en Redeploy.
      args:
        BUILD_ID: ${DOKPLOY_COMMIT_SHA:-${GITHUB_SHA:-${BUILD_ID:-local}}}
      # "Force Rebuild"/"Rebuild" en Dokploy equivale al no-cache.
    # Fuerza a Dokploy a CONSTRUIR la imagen en cada deploy en vez de
    # reutilizar una anterior (evita que los cambios "no salgan").
    pull_policy: build
    # ⚠️ Sin container_name fijo: Dokploy crea un contenedor nuevo por deploy.
    # Con nombre fijo, el deploy falla con "container already exists" y obliga
    # a reiniciar el VPS a mano para liberarlo.
    # ⚠️ NO exponer puertos aquí: Dokploy/Traefik rutea internamente al puerto 80.
    # Declarar "ports" rompe el challenge HTTP-01 de Let's Encrypt y Traefik
    # termina sirviendo TRAEFIK DEFAULT CERT ("no seguro").
    expose:
      - "80"
    volumes:
      # ⚠️ VOLUMEN PERSISTENTE: Los backups, logos y fotos viven aqui.
      # Sin este volumen, TODO se borra en cada actualizacion de Dokploy.
      # NOTA: solo se persiste storage/app (uploads/backups). El resto de
      # storage (framework/views, framework/cache, logs) queda DENTRO de la
      # imagen para que cada deploy arranque con vistas/config frescas.
      # Si se monta TODO storage, las vistas Blade compiladas del deploy
      # anterior sobreviven y los cambios "no salen" hasta resetear el VPS.
      - taller_storage:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - FORCE_HTTPS=true
      - SESSION_SECURE_COOKIE=true
      - TRUSTED_PROXIES=*
      - LOG_LEVEL=warning
      # Credenciales del SuperAdmin (panel /superadmin/login)
      # Definir en Dokploy → Environment; si no, usa estos valores por defecto.
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-luitechserena@gmail.com}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-password}
      # Token de emergencia para /recuperar-superadmin/{token}
      # Vacío = herramienta de recuperación DESACTIVADA (recomendado en operación normal).
      - SUPERADMIN_RECOVERY_TOKEN=${SUPERADMIN_RECOVERY_TOKEN:-}
      # Marca de la plataforma (landing principal www.serviciotecnico.fun)
      - PLATFORM_BRAND_NAME=${PLATFORM_BRAND_NAME:-Servicio Técnico}
      - PLATFORM_EMAIL=${PLATFORM_EMAIL:-contacto@serviciotecnico.fun}
      - PLATFORM_TELEFONO=${PLATFORM_TELEFONO:-}
      - PLATFORM_DIRECCION=${PLATFORM_DIRECCION:-}
      # Correo SMTP (recuperación de contraseña y avisos)
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-contacto@serviciotecnico.fun}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Servicio Técnico}
      # ── Fuerza rebuild en cada push: Dokploy invalida caché al cambiar
      # el compose (antes reutilizaba capas y no salían los cambios) ──
      - BUILD_ID=${BUILD_ID:-local}
    restart: unless-stopped
    # ⚠️ Sin "networks" personalizada: Dokploy conecta la app a su red interna
    # (dokploy-network) donde Traefik resuelve el servicio y emite el SSL.
    # Una red bridge propia aísla el contenedor y Traefik sirve DEFAULT CERT.

# ⚠️ NO hay servicio mysql aqui.
# Usa la base de datos PostgreSQL que Dokploy te ofrece como servicio externo.
# En Dokploy ve a "Databases" → crea una PostgreSQL
# y copia sus valores (Host, Port, Database, User, Password) en las variables
# DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD

volumes:
  # Volumen persistente para storage (backups, logos, fotos)
  taller_storage:

# ⚠️ Sin bloque "networks": ver nota en el servicio app.