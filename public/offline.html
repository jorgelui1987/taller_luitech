<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión — Taller CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0a3e, #4a1d96);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .offline-card {
            max-width: 420px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn-retry {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }
        .btn-retry:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .signal-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 12px;
            opacity: 0.6;
        }
        .signal-indicator .bar {
            width: 3px;
            border-radius: 2px;
            background: #4ade80;
            animation: pulse 1.5s infinite;
        }
        .signal-indicator .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .signal-indicator .bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
        .signal-indicator .bar:nth-child(3) { height: 20px; animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>Sin Conexión</h1>
        <p>
            No tienes acceso a internet en este momento.<br>
            Revisa tu conexión de datos o WiFi e inténtalo de nuevo.
        </p>
        <button class="btn-retry" onclick="location.reload()">
            <i class="fas fa-sync-alt me-2"></i>Reintentar
        </button>
        <div class="signal-indicator">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span>Buscando señal...</span>
        </div>
    </div>
</body>
</html>
