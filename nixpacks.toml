[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.bcmath", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.intl", "composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan key:generate --force || true",
  "php artisan storage:link || true",
  "php artisan migrate --force || true"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8080"