sonar.projectKey=taller
sonar.projectName=Servicio Tecnico
sonar.organization=jorgelui1987

sonar.sources=app,routes,database,resources/views
sonar.language=php
sonar.php.version=8.1
sonar.scm.provider=git
sonar.python.version=3
sonar.sourceEncoding=UTF-8

# Excluir archivos del framework que no son código de la aplicación
sonar.exclusions=**/vendor/**/*, **/node_modules/**/*, **/storage/**/*, **/bootstrap/**/*, **/public/**/*, **/tests/**/*, **/database/migrations/**/*, **/database/factories/**/*, **/database/seeders/**/*, **/config/**/*, **/lang/**/*, **/laravel/sail/runtimes/**/php.ini

# Ignorar hallazgos justificados (falsos positivos o ya mitigados)
# Dockerfile: Apache necesita root para enlazar al puerto 80, luego baja a www-data
sonar.issue.ignore.multicriteria.e1.ruleKey=dockerfile:S6504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
# TenantCreate: --password es entrada CLI segura (usa $this->secret()), no credencial hardcodeada
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=app/Console/Commands/TenantCreate.php
# php.ini de Sail: dependencias de Composer, la config segura está en docker/php.ini
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S3330
sonar.issue.ignore.multicriteria.e3.resourceKey=**/vendor/laravel/sail/runtimes/**/php.ini
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S3336
sonar.issue.ignore.multicriteria.e4.resourceKey=**/vendor/laravel/sail/runtimes/**/php.ini